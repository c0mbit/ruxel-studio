name: Release & Marketplace Publish

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-suite:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Verify Rust Workspace Tests
        run: cargo test --workspace

      - name: Verify TypeScript Workspace Builds
        run: npm --workspaces run build

  build-binaries:
    needs: test-suite
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            arch_key: win32-x64
            bin_ext: .exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            arch_key: linux-x64
            bin_ext: ''
          - os: macos-latest
            target: x86_64-apple-darwin
            arch_key: darwin-x64
            bin_ext: ''
          - os: macos-latest
            target: aarch64-apple-darwin
            arch_key: darwin-arm64
            bin_ext: ''
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Compile Release Binaries
        run: cargo build --release --target ${{ matrix.target }} --bin rux-daemon --bin rux-sync-server

      - name: Stage Compiled Binaries
        shell: bash
        run: |
          mkdir -p staged-bin/${{ matrix.arch_key }}
          cp target/${{ matrix.target }}/release/rux-daemon${{ matrix.bin_ext }} staged-bin/${{ matrix.arch_key }}/
          cp target/${{ matrix.target }}/release/rux-sync-server${{ matrix.bin_ext }} staged-bin/${{ matrix.arch_key }}/

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.arch_key }}
          path: staged-bin/${{ matrix.arch_key }}

  package-and-publish:
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Download Matrix Binary Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Execute Release Staging Pipeline
        run: node scripts/stage-release.mjs

      - name: Package VSIX Archive
        run: |
          cd packages/extension
          npx @vscode/vsce package --no-dependencies

      - name: Upload VSIX Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ruxel-studio-vsix
          path: packages/extension/*.vsix

      - name: Publish GitHub Release and VS Code Marketplace
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          VERSION=$(node -p "require('./packages/extension/package.json').version")
          TAG="v$VERSION"
          VSIX_FILE=$(ls packages/extension/*.vsix | head -n 1)

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$VSIX_FILE" --clobber
          else
            gh release create "$TAG" "$VSIX_FILE" --title "Ruxel Studio $TAG" --generate-notes
          fi

          if [ -n "$VSCE_PAT" ]; then
            cd packages/extension
            npx @vscode/vsce publish --packagePath *.vsix -p "$VSCE_PAT"
          else
            echo "VSCE_PAT secret not provided. Skipping automated marketplace publication."
          fi
