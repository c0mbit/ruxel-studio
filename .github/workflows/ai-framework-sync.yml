name: AI Framework Sync

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      target_framework:
        description: 'Target framework to sync (leave blank for all)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  framework-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Execute Autonomous Framework Sync
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ github.event.inputs.target_framework }}" ]; then
            cargo run --bin rux-autopatch -- sync --apply --framework "${{ github.event.inputs.target_framework }}"
          else
            cargo run --bin rux-autopatch -- sync --apply
          fi

      - name: Verify Rust Workspace Tests
        run: cargo test --workspace

      - name: Verify TypeScript Workspace Builds
        run: npm --workspaces run build

      - name: Commit and Push Framework Updates
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add crates/rux-codegen/src/plugins/ framework_versions.json Cargo.toml Cargo.lock package.json package-lock.json packages/
            git commit -m "chore(sync): automated framework updates via rux-autopatch [skip ci]"
            git push origin main
          fi

