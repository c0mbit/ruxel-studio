[package]
name = "rux-codegen"
version = "0.5.0"
edition.workspace = true
license.workspace = true
description = "Code generation and View-Controller binding engine for Ruxel Studio"

[lints]
workspace = true

[dependencies]
rux-ast = { path = "../rux-ast" }
syn = { workspace = true }
quote = { workspace = true }
proc-macro2 = { workspace = true }
prettyplease = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
dioxus-rsx = "0.5"
syn2 = { package = "syn", version = "2.0", features = ["full", "parsing"] }

[[test]]
name = "animation_codegen_tests"
path = "tests/animation_codegen_tests.rs"

[[test]]
name = "codegen_test"
path = "tests/codegen_test.rs"

[[test]]
name = "enterprise_tooling_tests"
path = "tests/enterprise_tooling_tests.rs"

[[test]]
name = "advanced_widgets_tests"
path = "tests/premium_widgets_tests.rs"

[[test]]
name = "reverse_parser_tests"
path = "tests/reverse_parser_tests.rs"

[[test]]
name = "phase1_wild_ast_tests"
path = "tests/phase1_wild_ast_tests.rs"

