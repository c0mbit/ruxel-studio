[package]
name = "rux-sync-server"
version = "0.5.0"
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
test = false

[[bin]]
name = "rux-sync-server"
path = "src/main.rs"
test = false

[dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1.40", features = ["full"] }
tokio-stream = "0.1"
futures-util = "0.3"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { workspace = true }
serde_json = { workspace = true }
tower-http = { version = "0.6", features = ["cors", "trace"] }
uuid = { workspace = true }
thiserror = { workspace = true }
tracing = "0.1"
tracing-subscriber = "0.3"
bytes = "1.7"
yrs = { workspace = true }
rux-ast = { path = "../rux-ast", version = "0.5.0" }

[dev-dependencies]
tokio-tungstenite = "0.24"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[[test]]
name = "collaboration_tests"
path = "tests/sync_server_tests.rs"
