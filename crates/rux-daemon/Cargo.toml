[package]
name = "rux-daemon"
version = "0.5.0"
edition.workspace = true
license.workspace = true
description = "JSON-RPC daemon for Ruxel Studio IDE integration"

[lints]
workspace = true

[dependencies]
rux-ast = { path = "../rux-ast" }
rux-codegen = { path = "../rux-codegen" }
rux-figma = { path = "../rux-figma" }
rux-sync-server = { path = "../rux-sync-server" }
