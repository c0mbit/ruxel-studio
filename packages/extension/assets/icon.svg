<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="borderGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0.6" />
    </linearGradient>
    <linearGradient id="rGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="45%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
    <linearGradient id="legGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <rect width="256" height="256" rx="56" fill="url(#bgGradient)" />
  <rect width="254" height="254" x="1" y="1" rx="55" fill="none" stroke="url(#borderGradient)" stroke-width="2" />

  <circle cx="128" cy="128" r="70" fill="#6366F1" opacity="0.15" filter="url(#glow)" />

  <g filter="url(#subtleShadow)">
    <rect x="68" y="58" width="28" height="140" rx="14" fill="url(#rGradient)" />

    <path d="M82,58 H138 C166,58 186,76 186,104 C186,132 166,150 138,150 H82 Z" 
          fill="none" 
          stroke="url(#rGradient)" 
          stroke-width="28" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <circle cx="132" cy="104" r="14" fill="#0E1626" />

    <path d="M124,136 L174,188 C179,193 188,198 196,198" 
          fill="none" 
          stroke="url(#legGradient)" 
          stroke-width="28" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
  </g>

  <circle cx="186" cy="72" r="5" fill="#38BDF8" opacity="0.9" filter="url(#glow)" />
</svg>
